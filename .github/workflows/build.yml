name: Build LightAlarm APK

# 触发条件：1) push 到 main/master；2) 手动点 Run workflow 按钮
on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-34 build-tools;34.0.0'

      - name: Setup Gradle 8.2 (cloud-provided, no wrapper jar needed)
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.2

      - name: Debug - List files
        run: |
          echo "=== Repository root ==="
          ls -la
          find . -name "build.gradle" -not -path "*/.git/*"

      - name: Decode signing keystore (from GitHub Secrets, optional)
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/lightalarm.jks"
            echo "keystore decoded"
          else
            echo "no keystore secret; release will be signed with debug key"
          fi

      - name: Build APK (release)
        env:
          KEYSTORE_FILE: ${{ runner.temp }}/lightalarm.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: Rename APK
        run: cp app/build/outputs/apk/release/app-release.apk "亮屏闹铃.apk"

      - name: Upload APK as artifact
        uses: actions/upload-artifact@v4
        with:
          name: LightAlarm-apk
          path: 亮屏闹铃.apk
          retention-days: 90
          if-no-files-found: error
