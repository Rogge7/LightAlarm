name: Build LightAlarm APK

permissions:
  contents: write   # 允许创建 Release 和 git tag

# 触发条件：1) push 到 main/master；2) 手动点 Run workflow 按钮
on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # 需要完整历史 + tags 来生成 changelog

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-34 build-tools;34.0.0'

      - name: Setup Gradle 8.2 (cloud-provided, no wrapper jar needed)
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.2

      - name: Debug - List files
        run: |
          echo "=== Repository root ==="
          ls -la
          find . -name "build.gradle" -not -path "*/.git/*"

      - name: Decode signing keystore (from GitHub Secrets, optional)
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/lightalarm.jks"
            echo "keystore decoded"
          else
            echo "no keystore secret; release will be signed with debug key"
          fi

      - name: Build APK (release)
        env:
          KEYSTORE_FILE: ${{ runner.temp }}/lightalarm.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: Rename APK
        run: cp app/build/outputs/apk/release/app-release.apk "亮屏闹铃.apk"

      - name: Upload APK as artifact
        uses: actions/upload-artifact@v4
        with:
          name: LightAlarm-apk
          path: 亮屏闹铃.apk
          retention-days: 90
          if-no-files-found: error

      - name: Extract version from build.gradle
        id: version
        run: |
          VERSION_NAME=$(grep -oP 'versionName\s+"\K[^"]+' app/build.gradle)
          VERSION_CODE=$(grep -oP 'versionCode\s+\K[0-9]+' app/build.gradle)
          TAG="v${VERSION_NAME}"
          echo "version_name=${VERSION_NAME}" >> "$GITHUB_OUTPUT"
          echo "version_code=${VERSION_CODE}" >> "$GITHUB_OUTPUT"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "Release ${TAG} (code ${VERSION_CODE})"

      - name: Generate changelog from git log
        id: changelog
        run: |
          TAG="${{ steps.version.outputs.tag }}"
          LAST_TAG=$(git describe --tags --abbrev=0 HEAD~1 2>/dev/null || echo "")
          if [ -n "$LAST_TAG" ] && git rev-parse "$LAST_TAG" >/dev/null 2>&1; then
            echo "### 更新日志" > changelog.md
            git log --oneline ${LAST_TAG}..HEAD >> changelog.md
          else
            echo "### 更新日志" > changelog.md
            git log --oneline -10 >> changelog.md
          fi
          echo "---" >> changelog.md
          echo "" >> changelog.md
          echo "包含 APK：**亮屏闹铃.apk**（release 签名）" >> changelog.md
          cat changelog.md
          echo "body<<EOF" >> "$GITHUB_OUTPUT"
          cat changelog.md >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"

      - name: Create / update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: "亮屏闹铃 ${{ steps.version.outputs.tag }}  (code ${{ steps.version.outputs.version_code }})"
          body: |
            ${{ steps.changelog.outputs.body }}
          files:
            - path: 亮屏闹铃.apk
              name: LightAlarm-${{ steps.version.outputs.tag }}.apk
          update_existing: true
          draft: false
          prerelease: false
          fail_on_unmatched_files: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
