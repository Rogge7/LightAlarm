plugins {
    id 'com.android.application'
}

android {
    namespace 'com.balilan.lightalarm'
    compileSdk 34

    defaultConfig {
        applicationId "com.balilan.lightalarm"
        minSdk 21
        targetSdk 34
        versionCode 4
        versionName "1.3"
    }

    // 发布签名：密钥库不进仓库，由 GitHub Secrets 在云端解码注入；
    // 未配置 Secrets 时（值为空字符串）回退 debug 签名，保证 APK 始终可安装
    def keystorePass = System.getenv('KEYSTORE_PASSWORD')
    def hasReleaseKey = keystorePass != null && keystorePass.length() > 0
    signingConfigs {
        release {
            def ksFile = System.getenv('KEYSTORE_FILE')
            if (ksFile != null && ksFile.length() > 0) storeFile file(ksFile)
            storePassword keystorePass
            keyAlias System.getenv('KEY_ALIAS') ?: 'lightalarm'
            keyPassword System.getenv('KEY_PASSWORD')
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig hasReleaseKey ? signingConfigs.release : signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
}
